<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(115deg, #0ca678 0%, #1971c2 52%, #6741d9 100%);
    color: #fff; padding: 70px 80px; display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .glow { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .35; }
  .g1 { width: 460px; height: 460px; background: #4dd4ac; top: -160px; right: -120px; }
  .g2 { width: 380px; height: 380px; background: #845ef7; bottom: -150px; left: 40%; }
  .kicker { font-size: 26px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; opacity: .85; }
  h1 { font-size: 104px; line-height: .98; letter-spacing: -3px; margin: 14px 0 18px; }
  .sub { font-size: 32px; opacity: .9; font-weight: 500; }
  .flags { display: flex; gap: 14px; margin-top: 8px; }
  .flags img { width: 78px; height: 56px; border-radius: 7px; box-shadow: 0 6px 18px rgba(0,0,0,.3); object-fit: cover; }
  .row { display: flex; align-items: flex-end; justify-content: space-between; z-index: 2; }
  .badge { font-size: 150px; }
  .meta { font-size: 24px; opacity: .8; z-index: 2; }
</style></head>
<body>
  <div class="glow g1"></div><div class="glow g2"></div>
  <div style="z-index:2">
    <div class="kicker">⚽ USA · Canada · Mexico</div>
    <h1>World Cup 2026</h1>
    <div class="sub">Plan the matches you'll actually watch.</div>
    <div class="flags">
      <img src="https://flagcdn.com/w160/ar.png"><img src="https://flagcdn.com/w160/br.png">
      <img src="https://flagcdn.com/w160/es.png"><img src="https://flagcdn.com/w160/fr.png">
      <img src="https://flagcdn.com/w160/gb-eng.png"><img src="https://flagcdn.com/w160/pt.png">
      <img src="https://flagcdn.com/w160/us.png"><img src="https://flagcdn.com/w160/mx.png">
    </div>
  </div>
  <div class="row">
    <div class="meta">104 matches · 48 teams · June 11 – July 19</div>
    <div class="badge">🏆</div>
  </div>
</body></html>
