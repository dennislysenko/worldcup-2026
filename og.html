<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: "Patrick Hand", sans-serif; color: #f2f5ee; position: relative; overflow: hidden;
    background: radial-gradient(1200px 700px at 70% -10%, #1c4537, transparent 60%), #15332a;
    padding: 70px 80px; display: flex; flex-direction: column; justify-content: space-between;
  }
  .pitch { position: absolute; inset: 0; opacity: .14; }
  .dust { position: absolute; inset: 0; opacity: .05; background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 7px 7px; }
  .vig { position: absolute; inset: 0; box-shadow: inset 0 0 240px rgba(0,0,0,.5); }
  .z { position: relative; z-index: 2; }
  .kicker { font-size: 26px; letter-spacing: 3px; text-transform: uppercase; color: #ffe08a; }
  h1 { font-family: "Caveat", cursive; font-size: 132px; line-height: .9; margin: 6px 0 14px; text-shadow: 0 0 3px rgba(255,255,255,.3); }
  .sub { font-size: 34px; color: #a9c2b4; }
  .flags { display: flex; gap: 14px; margin-top: 26px; }
  .flags img { width: 78px; height: 56px; border-radius: 5px; box-shadow: 0 0 0 2px rgba(242,245,238,.55); object-fit: cover; }
  .row { display: flex; align-items: flex-end; justify-content: space-between; }
  .meta { font-size: 25px; color: #a9c2b4; }
  .ball { font-size: 120px; }
</style></head>
<body>
  <svg class="pitch" viewBox="0 0 1200 630" preserveAspectRatio="none"><g fill="none" stroke="#f2f5ee" stroke-width="3"><line x1="600" y1="0" x2="600" y2="630"/><circle cx="600" cy="315" r="150"/><rect x="0" y="170" width="150" height="290"/><rect x="1050" y="170" width="150" height="290"/></g></svg>
  <div class="dust"></div><div class="vig"></div>
  <div class="z">
    <div class="kicker">⚽ USA · Canada · Mexico</div>
    <h1>World Cup 2026</h1>
    <div class="sub">Plan the matches you'll actually watch.</div>
    <div class="flags">
      <img src="https://flagcdn.com/w160/ar.png"><img src="https://flagcdn.com/w160/br.png">
      <img src="https://flagcdn.com/w160/es.png"><img src="https://flagcdn.com/w160/fr.png">
      <img src="https://flagcdn.com/w160/gb-eng.png"><img src="https://flagcdn.com/w160/pt.png">
      <img src="https://flagcdn.com/w160/us.png"><img src="https://flagcdn.com/w160/mx.png">
    </div>
  </div>
  <div class="row z">
    <div class="meta">104 matches · 48 teams · June 11 – July 19</div>
    <div class="ball">⚽</div>
  </div>
</body></html>
