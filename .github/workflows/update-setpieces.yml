name: Update set-piece + score data

on:
  schedule:
    - cron: '30 6 * * *' # 06:30 UTC nightly — after the last North-American match ends
  workflow_dispatch:
  push:
    branches: [main]
    paths: # e.g. the nightly Claude routine pushing cited overrides
      - set-piece-goals.json
      - set-piece-overrides.json
      - scores.json
      - elo.js
      - proj-history.json

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Stop after the tournament
        run: |
          if [ "$(date -u +%Y%m%d)" -gt 20260725 ]; then
            echo "Tournament over — nothing to do."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 22

      - name: Rebake data from ESPN + eloratings, refresh projections
        if: env.SKIP != '1' && github.event_name != 'push'
        run: |
          node scripts/update-scores.mjs
          node scripts/update-setpieces.mjs
          node scripts/update-elo.mjs
          node scripts/update-proj-history.mjs

      - name: Commit if changed
        if: env.SKIP != '1' && github.event_name != 'push'
        id: commit
        run: |
          if git diff --quiet set-piece-goals.json scores.json elo.js proj-history.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "setpiece-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add set-piece-goals.json scores.json elo.js proj-history.json
            git commit -m "chore: nightly refresh — scores, set pieces, elo, projections"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Vercel production
        if: env.SKIP != '1' && (github.event_name == 'push' || steps.commit.outputs.changed == 'true')
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_8ichAE5u6FUb1OJCSCthh9fQ
          VERCEL_PROJECT_ID: prj_aVCxW8XEL4lWxwnvlOFoWqAAS50d
        run: npx vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN"
